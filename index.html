<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdullah Islam Shuvo | Digital Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #00d2ff;
            --secondary-color: #3a7bd5;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow-x: hidden; color: white;
        }

        /* Animated Background Circles */
        .circles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .circles li { position: absolute; list-style: none; background: rgba(255, 255, 255, 0.1); animation: animate 25s linear infinite; bottom: -150px; }
        @keyframes animate {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* Containers */
        .content-area { width: 100%; max-width: 400px; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .glass-box {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 35px; border-radius: 30px; text-align: center;
            width: 100%; box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            transition: 0.5s ease;
        }

        /* Visiting Card View */
        .profile-container {
            width: 110px; height: 110px; margin: 0 auto 15px;
            border-radius: 50%; padding: 5px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }
        .profile-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }

        .social-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .social-item { text-decoration: none; color: #fff; font-size: 10px; transition: 0.3s; }
        .social-item i { display: block; font-size: 22px; margin-bottom: 5px; }
        .social-item:hover { color: var(--primary-color); transform: translateY(-5px); }

        /* Tools Trigger Button (Outside Box) */
        .tools-trigger {
            margin-top: 25px; background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
            padding: 15px 40px; border-radius: 50px; cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px;
        }
        .tools-trigger:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        /* Tools View */
        #tools-view { display: none; }
        .back-btn { cursor: pointer; font-size: 24px; color: var(--primary-color); margin-bottom: 20px; display: inline-block; }
        .tool-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .tool-item { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; }
        .tool-item:hover { background: rgba(255,255,255,0.15); border: 1px solid var(--primary-color); }
        .tool-item i { font-size: 30px; color: var(--primary-color); margin-bottom: 10px; display: block; }

        /* Floating Button (FAB) */
        .fab-wrapper { position: fixed; bottom: 80px; right: 25px; z-index: 1000; }
        .fab-main { width: 55px; height: 55px; background: var(--primary-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .fab-list { position: absolute; bottom: 65px; right: 0; background: #fff; padding: 10px; border-radius: 12px; display: none; flex-direction: column; gap: 15px; width: 140px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .fab-list a { text-decoration: none; color: #333; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
        .fab-list i { font-size: 18px; }

        /* Footer */
        footer { margin-top: auto; padding: 25px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); }
        footer b { color: var(--primary-color); }

    </style>
</head>
<body>

    <ul class="circles">
        <li style="left: 25%; width: 80px; height: 80px;"></li>
        <li style="left: 10%; width: 20px; height: 20px; animation-delay: 2s;"></li>
        <li style="left: 70%; width: 50px; height: 50px; animation-delay: 4s;"></li>
    </ul>

    <div class="content-area">
        <div id="card-view" style="width: 100%; text-align: center;">
            <div class="glass-box">
                <div class="profile-container">
                    <img src="Gemini_Generated_Image_4nyihv4nyihv4nyi.png" alt="Profile">
                </div>
                <h3>Abdullah Islam Shuvo</h3>
                <p style="font-size: 12px; color: var(--primary-color); letter-spacing: 2px;">DEVELOPER & TECH LOVER</p>
                
                <div class="social-links">
                    <a href="#" class="social-item"><i class="fab fa-facebook-f"></i><span>Facebook</span></a>
                    <a href="#" class="social-item"><i class="fab fa-youtube"></i><span>YouTube</span></a>
                    <a href="#" class="social-item"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
                    <a href="#" class="social-item"><i class="fab fa-tiktok"></i><span>TikTok</span></a>
                    <a href="#" class="social-item"><i class="fas fa-envelope"></i><span>Gmail</span></a>
                    <a href="#" class="social-item"><i class="fab fa-telegram-plane"></i><span>Telegram</span></a>
                </div>
            </div>
            
            <div class="tools-trigger" onclick="toggleView('tools')">
                <i class="fas fa-toolbox"></i> Open Tools Box
            </div>
        </div>

        <div id="tools-view" class="glass-box">
            <div style="text-align: left;">
                <i class="fas fa-arrow-left back-btn" onclick="toggleView('card')"></i>
            </div>
            <h3 style="margin-bottom: 10px;">My Toolbox</h3>
            <p style="font-size: 11px; color: rgba(255,255,255,0.5);">Select a tool to use</p>

            <div class="tool-list">
                <div class="tool-item" onclick="alert('Age Calculator Opening...')">
                    <i class="fas fa-birthday-cake"></i>
                    <span>Age Calc</span>
                </div>
                <div class="tool-item" onclick="alert('QR Scanner & Generator Opening...')">
                    <i class="fas fa-qrcode"></i>
                    <span>QR Master</span>
                </div>
            </div>
        </div>
    </div>

    <div class="fab-wrapper">
        <div class="fab-list" id="fab-list">
            <a href="#"><i class="fab fa-github" style="color: #333;"></i> GitHub</a>
            <a href="#"><i class="fab fa-facebook" style="color: #1877f2;"></i> Facebook</a>
            <a href="#"><i class="fab fa-whatsapp" style="color: #25d366;"></i> WhatsApp</a>
        </div>
        <div class="fab-main" onclick="toggleFab()">
            <i class="fas fa-plus" id="fab-icon" style="transition: 0.3s;"></i>
        </div>
    </div>

    <footer>
        Developed by <b>Abdullah Islam Shuvo</b> <br>
        &copy; 2026 All Rights Reserved.
    </footer>

    <script>
        function toggleView(view) {
            const cardView = document.getElementById('card-view');
            const toolsView = document.getElementById('tools-view');
            
            if(view === 'tools') {
                cardView.style.display = 'none';
                toolsView.style.display = 'block';
            } else {
                cardView.style.display = 'block';
                toolsView.style.display = 'none';
            }
        }

        function toggleFab() {
            const list = document.getElementById('fab-list');
            const icon = document.getElementById('fab-icon');
            if(list.style.display === 'flex') {
                list.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                list.style.display = 'flex';
                icon.style.transform = 'rotate(45deg)';
            }
        }
    </script>
</body>
</html>
