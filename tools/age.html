<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --bg: #0f0c29; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s ease; }
        
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .container { background: rgba(255, 255, 255, 0.05); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); max-width: 400px; width: 100%; backdrop-filter: blur(20px); text-align: center; }
        
        input { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; margin: 20px 0; font-size: 16px; outline: none; text-align: center; }
        
        button { width: 100%; padding: 18px; border-radius: 15px; border: none; background: linear-gradient(45deg, var(--primary), #3a7bd5); color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:active { transform: translateY(-5px) scale(0.97); box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4); }

        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1a1a3a; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid var(--primary); max-width: 300px; }
        .modal button { margin-top: 20px; background: var(--primary); color: black; }
    </style>
</head>
<body>

    <div class="container">
        <h3>Age Calculator</h3>
        <input type="date" id="dob">
        <button onclick="calculate()">CALCULATE</button>
        <div id="result" style="margin-top:20px; color:var(--primary)"></div>
    </div>

    <div id="errorModal" class="modal">
        <div class="modal-content">
            <i class="fas fa-exclamation-circle" style="font-size: 40px; color: #ff0050;"></i>
            <p id="errorMsg" style="margin: 20px 0;"></p>
            <button onclick="closeModal()">Try Again</button>
        </div>
    </div>

    <script>
        function calculate() {
            let dobValue = document.getElementById('dob').value;
            let errorMsg = document.getElementById('errorMsg');
            
            // ভ্যালিডেশন লজিক
            if (!dobValue) {
                showError("Please Enter your Birthday!");
                return;
            }

            let birth = new Date(dobValue);
            let now = new Date();

            if (birth > now) {
                showError("Please enter your real birthday!");
                return;
            }

            // ক্যালকুলেশন
            let years = now.getFullYear() - birth.getFullYear();
            let months = now.getMonth() - birth.getMonth();
            let days = now.getDate() - birth.getDate();

            if (days < 0) { months--; days += 30; }
            if (months < 0) { years--; months += 12; }

            document.getElementById('result').innerHTML = "Your Age: <br><b>" + years + "  Year " + months + " Months " + days + " Day </b>";
        }

        function showError(msg) {
            document.getElementById('errorMsg').innerText = msg;
            document.getElementById('errorModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('errorModal').style.display = 'none';
        }
    </script>
</body>
</html>
