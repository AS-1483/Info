<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --bg: #0f0c29; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .container { background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); max-width: 400px; width: 100%; backdrop-filter: blur(20px); text-align: center; position: relative; }
        
        /* Back Button Style */
        .back-btn { position: absolute; top: 20px; left: 20px; font-size: 20px; color: white; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { color: var(--primary); transform: translateX(-5px); }
        
        h3 { margin: 10px 0 25px 0; }
        input { width: 100%; padding: 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; margin-bottom: 20px; text-align: center; font-size: 16px; outline: none; }
        button { width: 100%; padding: 18px; border-radius: 15px; border: none; background: linear-gradient(45deg, var(--primary), #3a7bd5); color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        #result { margin-top: 25px; font-size: 1.1rem; }
        #result b { color: var(--primary); display: block; font-size: 1.4rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="back-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </div>

        <h3>Age Calculator</h3>
        <input type="date" id="dob">
        <button onclick="calculate()">CALCULATE</button>
        <div id="result"></div>
    </div>

    <script>
        // ব্যাক অ্যারো ফাংশন
        function goBack() {
            window.parent.postMessage('closeTools', '*');
        }

        function calculate() {
            let dobValue = document.getElementById('dob').value;
            let resultDiv = document.getElementById('result');
            
            if (!dobValue) {
                alert("আপনার জন্ম তারিখ নির্বাচন করুন!");
                return;
            }

            let birth = new Date(dobValue);
            let now = new Date();

            if (birth > now) {
                alert("ভুল তারিখ!");
                return;
            }

            let yDiff = now.getFullYear() - birth.getFullYear();
            let mDiff = now.getMonth() - birth.getMonth();
            let dDiff = now.getDate() - birth.getDate();

            if (dDiff < 0) {
                mDiff--;
                let prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                dDiff += prevMonth.getDate();
            }
            if (mDiff < 0) {
                yDiff--;
                mDiff += 12;
            }

            resultDiv.innerHTML = "আপনার বয়স: <br><b>" + yDiff + " বছর " + mDiff + " মাস " + dDiff + " দিন </b>";
        }
    </script>
</body>
</html>
