<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Professional Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --bg: #0f0c29; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s ease; }
        
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .container { 
            background: #1a1a3a; padding: 25px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(15px);
            text-align: center; position: relative;
        }
        
        .back-btn { position: absolute; top: 20px; left: 20px; cursor: pointer; color: var(--primary); font-size: 20px; }
        h3 { margin-top: 5px; margin-bottom: 15px; font-size: 18px; }
        
        textarea { width: 100%; height: 80px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; padding: 12px; margin: 8px 0; outline: none; resize: none; }
        
        .btn-group { display: flex; gap: 8px; margin: 10px 0; }
        .action-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
        .copy-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: white; font-weight: bold; cursor: pointer; }
        
        .action-btn:active, .copy-btn:active { transform: translateY(-5px) scale(0.97); box-shadow: 0 8px 15px rgba(0, 210, 255, 0.3); }

        /* পপ-আপ স্টাইল */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1a1a3a; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid var(--primary); max-width: 280px; }
        .modal button { margin-top: 20px; background: var(--primary); color: #000; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <i class="fas fa-arrow-left back-btn" onclick="window.parent.postMessage('closeTools', '*')"></i>
        <h3>Base64 Tool</h3>
        
        <textarea id="input" placeholder="এখানে টেক্সট বা Base64 লিখুন..."></textarea>
        
        <div class="btn-group">
            <button class="action-btn" onclick="process(true)">ENCODE</button>
            <button class="action-btn" onclick="process(false)">DECODE</button>
        </div>

        <textarea id="output" placeholder="ফলাফল এখানে আসবে..." readonly></textarea>
        <button class="copy-btn" onclick="copyResult()">COPY RESULT</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <i id="modalIcon" class="fas" style="font-size: 35px;"></i>
            <p id="modalMsg" style="margin: 20px 0; font-size: 14px;"></p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // প্রসেস ফাংশন
        function process(isEncode) {
            const input = document.getElementById('input').value;
            if(!input) return showModal("fa-times-circle", "#ff0050", "অনুগ্রহ করে কিছু টেক্সট লিখুন!");
            
            try {
                if(isEncode) {
                    document.getElementById('output').value = btoa(unescape(encodeURIComponent(input)));
                } else {
                    document.getElementById('output').value = decodeURIComponent(escape(atob(input)));
                }
            } catch(e) {
                showModal("fa-times-circle", "#ff0050", "ভুল ইনপুট! সঠিক ফরম্যাট চেক করুন।");
            }
        }

        // কপি ফাংশন
        function copyResult() {
            const out = document.getElementById('output');
            if(!out.value) return showModal("fa-times-circle", "#ff0050", "কপি করার কিছু নেই!");
            
            out.select();
            document.execCommand('copy');
            
            // সাকসেস পপ-আপ
            showModal("fa-check-circle", "#00d2ff", "সফলভাবে কপি হয়েছে!");
        }

        // পপ-আপ দেখানোর ফাংশন
        function showModal(icon, color, msg) {
            document.getElementById('modalIcon').className = "fas " + icon;
            document.getElementById('modalIcon').style.color = color;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
