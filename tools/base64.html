<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Professional Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --glass: rgba(255, 255, 255, 0.05); }
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; padding: 20px; min-height: 100vh; margin: 0; }
        .container { background: #1a1a3a; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .back-btn { cursor: pointer; color: var(--primary); font-size: 20px; margin-bottom: 20px; display: inline-block; }
        textarea { width: 100%; height: 120px; background: #0f0c29; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; padding: 15px; margin: 10px 0; outline: none; box-sizing: border-box; resize: none; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
        .copy-btn { background: rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <i class="fas fa-arrow-left back-btn" onclick="location.href='list.html'"></i>
        <h3>Base64 Encoder/Decoder</h3>
        
        <textarea id="input" placeholder="এখানে টেক্সট বা Base64 কোড লিখুন..."></textarea>
        
        <div class="btn-group">
            <button class="action-btn" onclick="process(true)">ENCODE</button>
            <button class="action-btn" onclick="process(false)">DECODE</button>
        </div>

        <textarea id="output" placeholder="ফলাফল এখানে আসবে..." readonly></textarea>
        <button class="action-btn copy-btn" onclick="copyResult()">COPY RESULT</button>
    </div>

    <script>
        function process(isEncode) {
            const input = document.getElementById('input').value;
            try {
                if(isEncode) {
                    document.getElementById('output').value = btoa(unescape(encodeURIComponent(input)));
                } else {
                    document.getElementById('output').value = decodeURIComponent(escape(atob(input)));
                }
            } catch(e) {
                alert("ভুল ইনপুট! সঠিক Base64 ফরম্যাট চেক করুন।");
            }
        }

        function copyResult() {
            const out = document.getElementById('output');
            out.select();
            document.execCommand('copy');
            alert("ফলাফল কপি হয়েছে!");
        }
    </script>
</body>
</html>
