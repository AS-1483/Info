<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Price Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --bg: #0f0c29; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .container { 
            background: #1a1a3a; padding: 30px; border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); backdrop-filter: blur(20px);
            text-align: center; position: relative;
        }
        
        .back-btn { position: absolute; top: 25px; left: 25px; cursor: pointer; color: var(--primary); font-size: 20px; }
        .back-btn:hover { color: white; transform: translateX(-5px); }
        
        /* সুইচ বাটন */
        .switch-container { margin-bottom: 25px; padding: 5px; background: rgba(0,0,0,0.4); border-radius: 12px; display: flex; }
        .switch-btn { flex: 1; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .active-mode { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        .calc-mode { display: none; opacity: 0; transform: translateY(10px); }
        .active-calc { display: block; opacity: 1; transform: translateY(0); }
        
        input { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.3); color: white; margin-bottom: 12px; outline: none; text-align: center; font-size: 16px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }
        
        .result-highlight { margin-top: 20px; padding: 20px; background: rgba(0, 210, 255, 0.05); border: 1px solid var(--primary); border-radius: 15px; }
        .final-val { font-size: 24px; color: var(--primary); font-weight: bold; display: block; margin-top: 8px; text-shadow: 0 0 10px rgba(0,210,255,0.5); }
    </style>
</head>
<body>

    <div class="container">
        <i class="fas fa-arrow-left back-btn" onclick="window.parent.postMessage('closeTools', '*')"></i>
        <h3>Price Calculator</h3>
        
        <div class="switch-container">
            <div id="btn1" class="switch-btn active-mode" onclick="toggleMode(1)">Price Mode</div>
            <div id="btn2" class="switch-btn" onclick="toggleMode(2)">Weight Mode</div>
        </div>

        <div id="mode1" class="calc-mode active-calc">
            <input type="number" id="weight" placeholder="ওজন (কেজি)" oninput="calcPrice()">
            <input type="number" id="rate1" placeholder="দর (প্রতি কেজি)" oninput="calcPrice()">
            <div class="result-highlight">
                <span style="font-size: 12px; opacity: 0.7;">মোট দাম:</span>
                <span id="totalPrice" class="final-val">০.০০ টাকা</span>
            </div>
        </div>

        <div id="mode2" class="calc-mode">
            <input type="number" id="budget" placeholder="আপনার বাজেট (টাকা)" oninput="calcWeight()">
            <input type="number" id="rate2" placeholder="পণ্যের দর (প্রতি কেজি)" oninput="calcWeight()">
            <div class="result-highlight">
                <span style="font-size: 12px; opacity: 0.7;">আপনি পাবেন:</span>
                <span id="totalWeight" class="final-val">০.০০০ কেজি</span>
            </div>
        </div>
    </div>

    <script>
        function toggleMode(mode) {
            document.getElementById('mode1').className = (mode === 1) ? 'calc-mode active-calc' : 'calc-mode';
            document.getElementById('mode2').className = (mode === 2) ? 'calc-mode active-calc' : 'calc-mode';
            document.getElementById('btn1').className = (mode === 1) ? 'switch-btn active-mode' : 'switch-btn';
            document.getElementById('btn2').className = (mode === 2) ? 'switch-btn active-mode' : 'switch-btn';
        }

        function calcPrice() {
            const w = parseFloat(document.getElementById('weight').value);
            const r = parseFloat(document.getElementById('rate1').value);
            const total = w * r;
            document.getElementById('totalPrice').innerText = (!isNaN(total) && total > 0) ? total.toLocaleString() + " টাকা" : "০.০০ টাকা";
        }

        function calcWeight() {
            const b = parseFloat(document.getElementById('budget').value);
            const r = parseFloat(document.getElementById('rate2').value);
            if (!isNaN(b) && !isNaN(r) && r > 0) {
                const res = b / r;
                document.getElementById('totalWeight').innerText = (res < 1) ? (res * 1000).toFixed(0) + " গ্রাম" : res.toFixed(3) + " কেজি";
            } else {
                document.getElementById('totalWeight').innerText = "০.০০০ কেজি";
            }
        }
    </script>
</body>
</html>
