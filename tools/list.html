<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tools | Elite UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00d2ff; --bg: #0f0c29; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg); color: white; margin: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* Bubble Animation (মেইন পেজের মতো) */
        .bubble-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .bubble { position: absolute; bottom: -100px; background: rgba(255, 255, 255, 0.03); border-radius: 50%; animation: rise 10s infinite linear; }
        @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateY(-110vh) scale(1.5); opacity: 0; } }

        .header { width: 90%; max-width: 900px; padding: 40px 0; display: flex; align-items: center; z-index: 1; }
        .back-btn { cursor: pointer; font-size: 28px; color: var(--primary); transition: 0.3s; }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }
        h2 { margin-left: 20px; font-weight: 300; letter-spacing: 3px; color: #fff; }

        .grid { 
            display: grid; width: 90%; max-width: 900px; gap: 20px; z-index: 1;
            grid-template-columns: repeat(2, 1fr); 
        }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        /* Tool Card with Floating Effect */
        .tool-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 30px 15px; border-radius: 20px; 
            text-align: center; cursor: pointer; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s ease;
            animation: floating 3s ease-in-out infinite;
        }
        .tool-card:hover { 
            background: var(--primary); color: #000;
            transform: translateY(-8px);
            animation: none; /* হোভার করলে ভাসমান এনিমেশন থেমে যাবে */
        }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .tool-card i { font-size: 30px; margin-bottom: 12px; display: block; }
        .tool-card span { font-weight: 500; font-size: 14px; }
    </style>
</head>
<body>

    <div class="bubble-container" id="bubble-container"></div>

    <div class="header">
        <i class="fas fa-arrow-left back-btn" onclick="window.parent.postMessage('closeTools', '*')"></i>
        <h2>MY TOOLS</h2>
    </div>

    <div class="grid">
        <div class="tool-card" onclick="location.href='age.html'"><i class="fas fa-birthday-cake"></i><span>Age Calc</span></div>
        <div class="tool-card" onclick="location.href='qr.html'"><i class="fas fa-qrcode"></i><span>QR Master</span></div>
        <div class="tool-card" onclick="location.href='speedtest.html'"><i class="fas fa-tachometer-alt"></i><span>Speed Test</span></div>
        <div class="tool-card" onclick="location.href='base64.html'"><i class="fas fa-lock"></i><span>Base64</span></div>
        <div class="tool-card" onclick="location.href='calculator.html'"><i class="fas fa-calculator"></i><span>Price Calc</span></div>
    </div>

    <script>
        // মেইন পেজের Bubble Generator
        const container = document.getElementById('bubble-container');
        for (let i = 0; i < 15; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 60 + 20 + 'px';
            bubble.style.width = size; bubble.style.height = size;
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
            bubble.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(bubble);
        }
    </script>
</body>
</html>
