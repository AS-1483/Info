<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Master | Professional Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #00d2ff; --glass: rgba(255, 255, 255, 0.05); }
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        
        /* থিম ম্যাচিং কন্টেইনার */
        .container { 
            background: #1a1a3a; padding: 30px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .back-btn { float: left; cursor: pointer; color: var(--primary); font-size: 20px; }
        
        .tabs { display: flex; gap: 10px; margin: 25px 0; }
        .tab-btn { flex: 1; padding: 10px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #000; font-weight: bold; }

        input, .file-upload { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #0f0c29; color: white; margin-bottom: 10px; }
        .action-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
        
        #qrcode { background: white; padding: 10px; width: fit-content; margin: 20px auto; border-radius: 10px; display: none; }
        #reader { width: 100%; border-radius: 15px; margin-top: 15px; overflow: hidden; }
        #scan-result { margin-top: 15px; color: var(--primary); word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <i class="fas fa-arrow-left back-btn" onclick="location.href='list.html'"></i>
        <h3>QR Master</h3>

        <div class="tabs">
            <button class="tab-btn active" id="gen-tab" onclick="switchMode('gen')">Generator</button>
            <button class="tab-btn" id="scan-tab" onclick="switchMode('scan')">Scanner</button>
        </div>

        <div id="gen-view">
            <input type="text" id="text-input" placeholder="Enter link or text">
            <button class="action-btn" onclick="generateQR()">GENERATE</button>
            <div id="qrcode"></div>
        </div>

        <div id="scan-view" style="display: none;">
            <div id="reader"></div>
            <p style="margin: 15px 0;">অথবা গ্যালারি থেকে আপলোড করুন:</p>
            <input type="file" id="qr-file" accept="image/*" class="file-upload">
            <div id="scan-result"></div>
        </div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");

        function switchMode(mode) {
            document.getElementById('gen-view').style.display = (mode === 'gen') ? 'block' : 'none';
            document.getElementById('scan-view').style.display = (mode === 'scan') ? 'block' : 'none';
            document.getElementById('gen-tab').classList.toggle('active', mode === 'gen');
            document.getElementById('scan-tab').classList.toggle('active', mode === 'scan');
            if(mode === 'scan') startCamera(); else stopCamera();
        }

        // Generator
        function generateQR() {
            let val = document.getElementById('text-input').value;
            let box = document.getElementById('qrcode');
            if(!val) return alert("কিছু লিখুন!");
            box.innerHTML = ""; box.style.display = "block";
            new QRCode(box, { text: val, width: 160, height: 160 });
        }

        // Live Scanner
        function startCamera() {
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, 
            (text) => { document.getElementById('scan-result').innerHTML = `Result: <a href="${text}" style="color:white" target="_blank">${text}</a>`; });
        }

        function stopCamera() { html5QrCode.stop().catch(err => {}); }

        // File Upload Scanner
        document.getElementById('qr-file').addEventListener('change', e => {
            html5QrCode.scanFile(e.target.files[0], true)
            .then(text => { document.getElementById('scan-result').innerHTML = `Result: <a href="${text}" style="color:white" target="_blank">${text}</a>`; })
            .catch(err => alert("কোড পাওয়া যায়নি!"));
        });
    </script>
</body>
</html>
