<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test | Professional Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0c29; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { 
            background: #1a1a3a; padding: 30px; border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .back-btn { float: left; cursor: pointer; color: #00d2ff; font-size: 20px; }
        .gauge { width: 200px; height: 200px; border-radius: 50%; border: 10px solid #0f0c29; margin: 30px auto; display: flex; align-items: center; justify-content: center; flex-direction: column; box-shadow: 0 0 20px rgba(0,210,255,0.3); }
        .speed-val { font-size: 32px; font-weight: bold; color: #00d2ff; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <i class="fas fa-arrow-left back-btn" onclick="location.href='list.html'"></i>
        <h3>Speed Test</h3>
        
        <div class="gauge">
            <span id="speed" class="speed-val">0</span>
            <span style="font-size: 12px; opacity: 0.7;">Mbps</span>
        </div>
        
        <button class="action-btn" id="start-btn" onclick="startTest()">START TEST</button>
        <p id="status" style="margin-top: 20px; font-size: 14px; opacity: 0.8;">Click to begin</p>
    </div>

    <script>
        async function startTest() {
            const btn = document.getElementById('start-btn');
            const speedEl = document.getElementById('speed');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = "Testing download...";
            
            const imageAddr = "https://upload.wikimedia.org/wikipedia/commons/3/3a/Bloemen_van_het_Vaticaan.jpg"; // বড় একটি ছবি
            const startTime = new Date().getTime();
            
            try {
                const response = await fetch(imageAddr + "?cache=" + startTime);
                const blob = await response.blob();
                const endTime = new Date().getTime();
                
                const duration = (endTime - startTime) / 1000;
                const bitsLoaded = blob.size * 8;
                const speedBps = (bitsLoaded / duration) / (1024 * 1024);
                
                speedEl.innerText = speedBps.toFixed(2);
                status.innerText = "Test Complete!";
            } catch(e) {
                status.innerText = "Error: Connection failed";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
